<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽車駕照模擬測驗</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .quiz-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 640px;
            width: 100%;
        }
        h2 { color: #333; margin-top: 0; }
        .progress { font-size: 14px; color: #666; margin-bottom: 20px; }
        .question {
            font-size: 17px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn {
            background-color: #ecf0f1;
            border: 2px solid #bdc3c7;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            line-height: 1.5;
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) { background-color: #3498db; color: white; border-color: #2980b9; }
        .option-btn.correct { background-color: #2ecc71; color: white; border-color: #27ae60; }
        .option-btn.wrong   { background-color: #e74c3c; color: white; border-color: #c0392b; }
        .option-btn:disabled { cursor: default; }
        .feedback {
            margin-top: 15px;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 15px;
            display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct-fb { background: #eafaf1; color: #1e8449; border: 1px solid #2ecc71; }
        .feedback.wrong-fb  { background: #fdedec; color: #922b21; border: 1px solid #e74c3c; }
        .next-btn {
            margin-top: 15px;
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 10px 28px;
            font-size: 15px;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }
        .next-btn:hover { background-color: #1a5276; }
        .result-container { text-align: center; display: none; }
        .score { font-size: 52px; font-weight: bold; color: #2ecc71; margin: 20px 0; }
        .score.fail { color: #e74c3c; }
        .restart-btn {
            background-color: #e67e22; color: white; border: none;
            padding: 12px 32px; font-size: 16px; border-radius: 5px; cursor: pointer;
        }
        .restart-btn:hover { background-color: #d35400; }
        #loading-msg { text-align: center; color: #666; padding: 40px 0; font-size: 16px; }
        .stat-bar {
            display: flex; gap: 6px; margin-bottom: 18px; font-size: 13px;
        }
        .stat-item { padding: 4px 10px; border-radius: 12px; font-weight: bold; }
        .stat-correct { background:#eafaf1; color:#1e8449; }
        .stat-wrong   { background:#fdedec; color:#922b21; }
        .stat-remain  { background:#eaf0fb; color:#2471a3; }
    </style>
</head>
<body>
<div class="quiz-container">
    <div id="loading-msg">⏳ 題庫載入中，請稍候…</div>

    <div id="quiz-box" style="display:none;">
        <h2>🚗 汽車駕照模擬測驗（50 題）</h2>
        <div class="stat-bar">
            <span class="stat-item stat-correct" id="stat-correct">✅ 答對：0</span>
            <span class="stat-item stat-wrong"   id="stat-wrong">❌ 答錯：0</span>
            <span class="stat-item stat-remain"  id="stat-remain">📝 剩餘：50</span>
        </div>
        <div class="progress" id="progress-text"></div>
        <div class="question" id="question-text"></div>
        <div class="options" id="options-box"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">下一題 ▶</button>
    </div>

    <div id="result-box" class="result-container">
        <h2>測驗結束！</h2>
        <div class="progress" id="final-progress"></div>
        <div class="score" id="score-text">0 分</div>
        <p id="summary-text"></p>
        <button class="restart-btn" onclick="startQuiz()">重新挑戰</button>
    </div>
</div>

<script>
let allQuestions = [];
let quizQuestions = [];
let currentIndex = 0;
let correctCount = 0;
let wrongCount = 0;

fetch('questions.json')
    .then(r => r.json())
    .then(data => {
        allQuestions = data;
        document.getElementById('loading-msg').style.display = 'none';
        startQuiz();
    })
    .catch(err => {
        document.getElementById('loading-msg').innerText =
            '❌ 題庫載入失敗，請確認 questions.json 與本檔案在同一資料夾。\n' + err;
    });

function startQuiz() {
    currentIndex = 0; correctCount = 0; wrongCount = 0;
    // Fisher-Yates 洗牌後取前 50 題
    let arr = [...allQuestions];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    quizQuestions = arr.slice(0, 50);

    document.getElementById('quiz-box').style.display = 'block';
    document.getElementById('result-box').style.display = 'none';
    updateStats();
    showQuestion();
}

function updateStats() {
    const remain = 50 - currentIndex;
    document.getElementById('stat-correct').textContent = `✅ 答對：${correctCount}`;
    document.getElementById('stat-wrong').textContent   = `❌ 答錯：${wrongCount}`;
    document.getElementById('stat-remain').textContent  = `📝 剩餘：${remain}`;
}

function showQuestion() {
    const q = quizQuestions[currentIndex];
    document.getElementById('progress-text').innerText =
        `第 ${currentIndex + 1} 題 / 共 50 題（題號 ${q.id}）`;

    // 分割題幹與選項
    const parts = q.q.split(/(?=(?:（\d）|\(\d\)))/);
    const main = parts[0].trim();
    document.getElementById('question-text').innerText = main;

    const box = document.getElementById('options-box');
    box.innerHTML = '';
    for (let i = 1; i <= 3; i++) {
        let text = `(${i})`;
        // 支援全形 （n） 和半形 (n) 兩種格式
        parts.forEach(p => {
            const stripped = p.trim();
            if (stripped.startsWith(`（${i}）`) || stripped.startsWith(`(${i})`)) {
                text = stripped;
            }
        });
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = text;
        btn.dataset.choice = i;
        btn.onclick = () => checkAnswer(i);
        box.appendChild(btn);
    }

    const fb = document.getElementById('feedback');
    fb.className = 'feedback'; fb.innerText = '';
    document.getElementById('next-btn').style.display = 'none';
}

function checkAnswer(choice) {
    const q = quizQuestions[currentIndex];
    const correct = choice === q.ans;
    if (correct) correctCount++; else wrongCount++;

    document.querySelectorAll('.option-btn').forEach(btn => {
        btn.disabled = true;
        const c = parseInt(btn.dataset.choice);
        if (c === q.ans) btn.classList.add('correct');
        else if (c === choice && !correct) btn.classList.add('wrong');
    });

    const fb = document.getElementById('feedback');
    if (correct) {
        fb.className = 'feedback correct-fb show';
        fb.innerText = '✅ 答對了！';
    } else {
        const parts = q.q.split(/(?=(?:（\d）|\(\d\)))/);
        let correctText = `(${q.ans})`;
        parts.forEach(p => {
            const s = p.trim();
            if (s.startsWith(`（${q.ans}）`) || s.startsWith(`(${q.ans})`)) correctText = s;
        });
        fb.className = 'feedback wrong-fb show';
        fb.innerText = `❌ 答錯了！正確答案是 ${correctText}`;
    }

    updateStats();
    document.getElementById('next-btn').style.display = 'inline-block';
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < 50) {
        showQuestion();
    } else {
        endQuiz();
    }
}

function endQuiz() {
    document.getElementById('quiz-box').style.display = 'none';
    document.getElementById('result-box').style.display = 'block';
    const score = correctCount * 2;
    const el = document.getElementById('score-text');
    el.innerText = `${score} 分`;
    el.className = score >= 85 ? 'score' : 'score fail';
    document.getElementById('final-progress').innerText =
        `答對 ${correctCount} 題 / 錯 ${wrongCount} 題 / 共 50 題`;
    document.getElementById('summary-text').innerText =
        score >= 85
            ? '🎉 太棒了！已達及格標準（85分），繼續保持！'
            : '⚠️ 及格分數為 85 分，建議重新練習加油！';
}
</script>
</body>
</html>
