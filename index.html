<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最新汽車筆試線上模擬考系統 (支援跨裝置匯入出)</title>
    <style>
        :root {
            --primary-color: #3498db;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --dark-color: #2c3e50;
            --bg-color: #f5f6fa;
        }
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--dark-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: var(--dark-color);
        }
        .stats-box {
            display: flex;
            justify-content: space-between;
            background: #edf2f7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-success { background-color: var(--success-color); color: white; }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-sync { background-color: #9b59b6; color: white; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; transform: none; }
        
        .quiz-area { display: none; }
        .question-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .option-btn {
            padding: 12px;
            text-align: left;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }
        .option-btn:hover { background: #e2e8f0; }
        .option-btn.selected { background: #dbeafe; border-color: #3b82f6; }
        
        .result-item {
            border-left: 5px solid var(--danger-color);
            background: #fff5f5;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
        }
        .correct-ans { color: var(--success-color); font-weight: bold; }
        .wrong-ans { color: var(--danger-color); font-weight: bold; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 跨裝置同步區塊樣式 */
        .sync-section {
            background: #fdf6e2;
            border: 1px solid #f39c12;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚗 汽車筆試模擬考與錯題複習系統</h1>
    
    <div class="stats-box">
        <div>題庫總數：<span id="total-pool">0</span> 題</div>
        <div>剩餘未考：<span id="remaining-pool">0</span> 題</div>
        <div>錯題本紀錄：<span id="wrong-count">0</span> 題</div>
    </div>

    <!-- 跨裝置同步工具區 -->
    <div class="sync-section">
        <strong>📱 跨裝置進度同步工具 (方案 A)</strong><br>
        <span style="font-size: 13px; color: #7f8c8d;">想換手機/電腦作答？點擊匯出複製進度，並在另一台裝置貼上匯入即可！</span>
        <div style="margin-top: 10px; display: flex; justify-content: center; gap: 10px;">
            <button class="btn-sync" style="padding: 6px 15px; font-size: 14px;" onclick="exportProgress()">📤 匯出目前進度</button>
            <button class="btn-sync" style="padding: 6px 15px; font-size: 14px; background-color: #34495e;" onclick="importProgress()">📥 匯入外部進度</button>
        </div>
    </div>

    <div class="btn-container">
        <button class="btn-primary" id="start-exam-btn" onclick="startNewExam()">開始新模擬考 (50題)</button>
        <button class="btn-danger" id="review-wrong-btn" onclick="startWrongReview()">挑戰錯題本</button>
        <button style="background: #7f8c8d; color: white;" onclick="resetPool()">重置整個題庫進度</button>
    </div>

    <!-- 測驗區域 -->
    <div id="quiz-area" class="quiz-area tab-content">
        <h2 id="quiz-title">模擬考試中</h2>
        <div id="progress-text" style="text-align: center; margin-bottom: 10px;"></div>
        <div id="question-container"></div>
        <div style="text-align: center; margin-top: 20px;">
            <button class="btn-success" id="submit-btn" onclick="submitExam()">提交答案</button>
        </div>
    </div>

    <!-- 結果與錯題本區域 -->
    <div id="result-area" class="tab-content">
        <h2 id="result-title">本次測驗結果</h2>
        <div id="result-summary" style="font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 20px;"></div>
        <div id="result-list"></div>
    </div>
</div>

<script>
// 完整題庫資料轉換 (精選部分核心與代表性題目作為系統示範，可自行擴充)
const fullQuestionBank = [
    { id: 1, ans: 2, q: "禁止任何車輛進入。(2)禁止四輪以上汽車及機車進入。(3)禁止行人通行。" },
    { id: 2, ans: 1, q: "禁止超車。(2)禁止會車。(3)禁止汽車進入。" },
    { id: 4, ans: 3, q: "當開車進入「國道施工路段」時，下列哪一項駕駛行為最能有效預防事故發生？(1)在施工縮減車道處加速超車。(2)開啟駕駛輔助系統後便放心地看手機。(3)提早變換至未施工車道，並保持隨時準備煞車的安全距離與專注力。" },
    { id: 5, ans: 1, q: "駕駛配備有 Level 2 等級先進駕駛輔助系統(ADAS)的新車行駛於國道。關於在駕駛過程中的行為與認知，下列哪一項最符合安全規範並能有效預防事故？(1)認知到目前的系統對「靜止工程車」辨識有限制，行經施工路段時應主動介入駕駛，而非依賴系統。(2)系統會自動跟車與修正方向盤，可以趁機滑手機或閉目養神。(3)因為系統能辨識車道線，所以行駛於大雨或大霧路段時，交給電腦操作比人工駕駛更安全。" },
    { id: 6, ans: 2, q: "下列關於「變換車道」的行為，何者錯誤？(1)變換車道時，應讓直行車先行，並注意安全距離。(2)在雙白實線上可雙邊變換車道。(3)顯示方向燈、轉頭察看照後鏡、檢查視野死角並注意有無障礙或車輛行人。" },
    { id: 11, ans: 2, q: "汽車駕駛人行駛於高速公路、快速公路，以變換燈光、連續密集按鳴喇叭迫使前車讓道，下列何者正確？(1)提醒前車讓路並無違規。(2)處新臺幣3,000元以上；6,000元以下罰鍰。(3)只要未發生事故不處罰。" },
    { id: 15, ans: 3, q: "曾因酒駕經吊銷駕駛執照，於重新考照後，必須加裝何種設備於車上始得行駛？(1)行車紀錄器。(2)車用滅火器。(3)車輛點火自動鎖定裝置(酒精鎖)。" },
    { id: 17, ans: 3, q: "關於酒駕之規定，下列何者正確？(1)酒測值標準是吐氣所含酒精濃度達每公升0.25毫克或血液中酒精濃度達0.10%以上。(2)12年內再犯酒駕，處新臺幣120,000元罰鍰。(3)酒駕拒測處新臺幣180,000元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照。" },
    { id: 22, ans: 3, q: "根據現行規定，若駕駛人遭遇警察攔檢並明確表示「拒絕接受酒精濃度測試」，其初次違規的處罰為何？(1)視酒精濃度決定罰鍰金額高低，當場移置保管該汽機車及吊扣其駕駛執照。(2)處新臺幣9萬元罰鍰，當場移置保管該汽機車及吊銷其駕駛執照。(3)處新臺幣18萬元罰鍰，當場移置保管該汽機車及吊銷其駕駛執照，接受道路交通安全講習。" },
    { id: 26, ans: 2, q: "關於汽機車駕駛人「酒測值超標」時，針對「同車乘客」之連坐處分，下列何種情況「免予處罰」？(1)乘客聲稱並不知道駕駛人有飲酒者。(2)乘客為未滿18歲、或年滿70歲者。(3)乘客與駕駛人並無親屬關係者。" },
    { id: 45, ans: 3, q: "汽車行駛下長坡時，正確的駕駛方式為何？(1)儘量使用腳煞車控制速度。(2)完全不使用任何煞車，讓車輛自然滑行。(3)善用低速檔引擎煞車，避免過度使用腳煞車。" },
    { id: 56, ans: 2, q: "汽車駕駛人行駛道路下列何者為對？(1)遇有急事要聯絡，可以使用行動電話。(2)以手持方式使用行動電話、電腦或其他相類功能裝置進行撥接、通話、數據通訊或其他有礙駕駛安全之行為，均為禁止之行為。(3)只要不妨礙他人安寧都可以使用撥接通話。" },
    { id: 71, ans: 3, q: "汽車駕駛人，行車速度超過規定之最高時速40公里以上者，處罰鍰新臺幣：(1)1,200~2,400元。(2)2,400~6,000元。(3)6,000~36,000元。" },
    { id: 84, ans: 3, q: "酒後開車，對駕駛人會產生「視覺之隧道效應」，駕駛者猶如在隧道中行車，前有亮光但四周漆黑，故酒後駕車：(1)視野不變。(2)視野變廣。(3)視野變窄。" },
    { id: 142, ans: 3, q: "汽車駕駛人行經鐵路平交道時，若車輛在鐵軌上突然熄火且無法發動，此時警鈴已響、遮斷器開始降下。根據事故預防與緊急處置程序，下列哪一項應變作為最正確？(1)立即打電話給保險公司或拖吊車。(2)因為還沒看到火車，應該留在車內不斷嘗試重新發動引擎。(3)應立即按下平交道旁的「緊急鈕」，並設法將車輛推離軌道；若火車已近，應迅速離開車輛往兩側空曠處逃生。" },
    { id: 158, ans: 3, q: "自中華民國115年2月28日起新登檢領照之自用小客車有黏貼隔熱紙者，前擋風玻璃可見光透過率應為：(1)50%以上。(2)60%以上。(3)70%以上。" },
    { id: 277, ans: 3, q: "汽車行駛至槽化線區域時，正確的行為為何？(1)可停車上下客。(2)可臨時停車但不得久停。(3)不得進入或跨越。" },
    { id: 310, ans: 1, q: "駕駛人駕車行經設有行人穿越道之路口，發現有行人正準備穿越時，下列處置何者正確？(1)應在行人穿越道前停讓行人優先通行，待行人安全通過後再起步。(2)預判行人通過速度後加速通過。(3)鳴按喇叭警示行人退讓。" },
    { id: 377, ans: 2, q: "汽車駕駛人違規併排停車將處罰鍰新臺幣：(1)1,200元以上3,000元以下。(2)1,800元以上3,000元以下。(3)2,400元以上3,000元以下。" }
];

// 核心狀態管理
let pool = JSON.parse(localStorage.getItem('car_quiz_pool')) || [...fullQuestionBank];
let wrongBank = JSON.parse(localStorage.getItem('car_quiz_wrong')) || [];
let currentExamQuestions = [];
let userAnswers = {};
let isReviewMode = false;

function updateUIInfo() {
    document.getElementById('total-pool').innerText = fullQuestionBank.length;
    document.getElementById('remaining-pool').innerText = pool.length;
    document.getElementById('wrong-count').innerText = wrongBank.length;
    document.getElementById('review-wrong-btn').disabled = wrongBank.length === 0;
}

function saveState() {
    localStorage.setItem('car_quiz_pool', JSON.stringify(pool));
    localStorage.setItem('car_quiz_wrong', JSON.stringify(wrongBank));
    updateUIInfo();
}

// 方案 A：匯出進度機制
function exportProgress() {
    const progressData = {
        poolIds: pool.map(q => q.id),
        wrongIds: wrongBank.map(q => q.id)
    };
    // 將資料轉為 Base64 字串方便複製傳送
    const dataString = btoa(encodeURIComponent(JSON.stringify(progressData)));
    
    // 自動複製到剪貼簿
    navigator.clipboard.writeText(dataString).then(() => {
        alert("📋 進度已成功複製到剪貼簿！\n請直接將它貼上並透過 LINE/Email 傳送到您的手機或其它裝置。");
    }).catch(err => {
        // 防呆：如果瀏覽器不支援自動複製，用 prompt 彈出讓使用者手動全選複製
        prompt("請複製下方框內的進度代碼：", dataString);
    });
}

// 方案 A：匯入進度機制
function importProgress() {
    const dataString = prompt("請貼上您在另一台裝置所複製的「進度代碼」：");
    if (!dataString) return;

    try {
        const decodedData = JSON.parse(decodeURIComponent(atob(dataString.trim())));
        
        if (decodedData.poolIds && decodedData.wrongIds) {
            // 還原剩餘題庫
            pool = fullQuestionBank.filter(q => decodedData.poolIds.includes(q.id));
            // 還原錯題本
            wrongBank = fullQuestionBank.filter(q => decodedData.wrongIds.includes(q.id));
            
            saveState();
            alert("✨ 進度匯入成功！系統已同步您在另一台裝置的作答進度與錯題本。");
            // 隱藏可能殘留的測驗畫面，重新整理資訊
            document.getElementById('quiz-area').style.display = 'none';
            document.getElementById('result-area').style.display = 'none';
        } else {
            alert("❌ 錯誤：進度代碼格式不正確！");
        }
    } catch (e) {
        alert("❌ 匯入失敗，請確認貼上的代碼完整無缺漏。");
    }
}

// 開始新模擬考
function startNewExam() {
    isReviewMode = false;
    if (pool.length === 0) {
        alert("🎉 恭喜！所有題庫的題目都已經全部出完了！系統將為您自動重置全新題庫。");
        pool = [...fullQuestionBank];
        saveState();
    }

    const shuffled = [...pool].sort(() => 0.5 - Math.random());
    currentExamQuestions = shuffled.slice(0, 50);
    
    pool = pool.filter(q => !currentExamQuestions.some(cq => cq.id === q.id));
    saveState();

    document.getElementById('quiz-title').innerText = "📝 汽車筆試隨機模擬考 (50題限時挑戰)";
    renderQuiz();
}

// 開始錯題本重新複習挑戰
function startWrongReview() {
    if (wrongBank.length === 0) return;
    isReviewMode = true;
    currentExamQuestions = [...wrongBank];
    document.getElementById('quiz-title').innerText = "🔥 錯題本加強挑戰 (重新作答複習)";
    renderQuiz();
}

// 產生測驗題目介面
function renderQuiz() {
    userAnswers = {};
    const container = document.getElementById('question-container');
    container.innerHTML = '';
    
    document.getElementById('quiz-area').style.display = 'block';
    document.getElementById('result-area').style.display = 'none';
    document.getElementById('progress-text').innerText = `本次測驗共計出題：${currentExamQuestions.length} 題`;

    currentExamQuestions.forEach((qObj, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        
        const opt1 = qObj.q.match(/\(1\)(.*?)(?=\(2\)|\(3\)|$)/);
        const opt2 = qObj.q.match(/\(2\)(.*?)(?=\(3\)|\(1\)|$)/);
        const opt3 = qObj.q.match(/\(3\)(.*?)(?=\(1\)|\(2\)|$)/);
        const questionText = qObj.q.split('(1)')[0];

        card.innerHTML = `
            <div><strong>第 ${index + 1} 題. ${questionText}</strong></div>
            <div class="options">
                <button class="option-btn" onclick="selectOption(${qObj.id}, 1, this)">① ${opt1 ? opt1[1] : '選項 1'}</button>
                <button class="option-btn" onclick="selectOption(${qObj.id}, 2, this)">② ${opt2 ? opt2[1] : '選項 2'}</button>
                <button class="option-btn" onclick="selectOption(${qObj.id}, 3, this)">③ ${opt3 ? opt3[1] : '選項 3'}</button>
            </div>
        `;
        container.appendChild(card);
    });
    
    window.scrollTo({ top: document.getElementById('quiz-area').offsetTop, behavior: 'smooth' });
}

function selectOption(qId, optionNum, btnEl) {
    const siblings = btnEl.parentElement.querySelectorAll('.option-btn');
    siblings.forEach(el => el.classList.remove('selected'));
    btnEl.classList.add('selected');
    userAnswers[qId] = optionNum;
}

// 提交考卷與統計結果
function submitExam() {
    let scoreCount = 0;
    const resultList = document.getElementById('result-list');
    resultList.innerHTML = '';
    
    currentExamQuestions.forEach((qObj) => {
        const userAns = userAnswers[qObj.id];
        const isCorrect = userAns === qObj.ans;
        
        if (isCorrect) {
            scoreCount++;
            if (isReviewMode) {
                wrongBank = wrongBank.filter(w => w.id !== qObj.id);
            }
        } else {
            if (!wrongBank.some(w => w.id === qObj.id)) {
                wrongBank.push(qObj);
            }
            
            const resultItem = document.createElement('div');
            resultItem.className = 'result-item';
            resultItem.innerHTML = `
                <div><strong>題目：</strong>${qObj.q.split('(1)')[0]}</div>
                <div>❌ 您的答案：<span class="wrong-ans">(${userAns || '未作答'})</span></div>
                <div>✅ 正確答案：<span class="correct-ans">(${qObj.ans})</span></div>
            `;
            resultList.appendChild(resultItem);
        }
    });

    saveState();

    const scoreText = `本次得分：${Math.round((scoreCount / currentExamQuestions.length) * 100)} 分 (答對 ${scoreCount} 題 / 共 ${currentExamQuestions.length} 題)`;
    document.getElementById('result-summary').innerText = scoreText;
    
    if (currentExamQuestions.length === scoreCount) {
        document.getElementById('result-list').innerHTML = '<div style="color:var(--success-color); font-weight:bold; text-align:center;">✨ 太棒了！本次測驗全對，沒有任何錯題！</div>';
    }

    document.getElementById('quiz-area').style.display = 'none';
    document.getElementById('result-area').style.display = 'block';
    window.scrollTo({ top: document.getElementById('result-area').offsetTop, behavior: 'smooth' });
}

// 全面重置整個題庫進度
function resetPool() {
    if(confirm("確定要重置所有題庫出題進度與錯題紀錄嗎？")) {
        pool = [...fullQuestionBank];
        wrongBank = [];
        saveState();
        alert("已成功恢復初始狀態！");
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'none';
    }
}

// 網頁初始化
updateUIInfo();
</script>

</body>
</html>
